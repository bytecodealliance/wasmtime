name: Publish Artifacts
on:
  push:
    branches: [main]
    tags-ignore: [dev]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  publish:
    name: Publish artifacts of build
    runs-on: ubuntu-latest
    if: github.repository == 'bytecodealliance/wasmtime'
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/fetch-run-id
    - run: |
        gh run download ${COMMIT_RUN_ID}
        ls
        find bins-*
      env:
        GH_TOKEN: ${{ github.token }}

    - run: ./ci/merge-artifacts.sh

    # Deploy the `gh-pages.tar.gz` artifact to the `gh-pages` branch.
    - run: tar xf gh-pages.tar.gz
      working-directory: gh-pages
    - if: github.ref == 'refs/heads/main'
      uses: actions/configure-pages@v5
    - if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v5
      with:
        path: "./gh-pages/gh-pages"

    - uses: actions/attest@v4
      with:
        subject-path: 'dist/*'

    - if: github.ref_name == 'main'
      run: |
          git tag -f dev
          git push origin dev:dev -f
          gh release create dev --prerelease dist/* ||
            gh release upload dev --clobber dist/*
      env:
        GH_TOKEN: ${{ github.token }}

    - if: github.ref_name != 'main'
      run: |
        sed '/---------------/Q' RELEASES.md > relnotes.md
        prerelease=
        case "${{ github.ref_name }}" in
          *-*) prerelease=--prerelease ;;
        esac
        gh release create ${{ github.ref_name }} $prerelease --notes-file relnotes.md dist/*
      env:
        GH_TOKEN: ${{ github.token }}
      continue-on-error: true

  # Publish the ISLE verifier's SMT query cache.
  isle-veri-cache:
    name: Publish new isle-veri cache
    runs-on: ubuntu-latest
    if: github.repository == 'bytecodealliance/wasmtime' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
    steps:
      # git checkout is needed to have the files we hash below.
    - uses: actions/checkout@v7
    - uses: ./.github/actions/fetch-run-id
    - name: Download rebuilt cache from CI run
      run: gh run download ${COMMIT_RUN_ID} --name isle-veri-cache
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Unpack rebuilt cache
      run: tar xzf isle-veri-cache.tar.gz -C cranelift/isle/veri
    - name: Save verifier cache
      uses: actions/cache/save@v6
      with:
        path: cranelift/isle/veri/cache
        # Note: keep this key in sync with cache fetch in `main.yml`'s isle-veri job.
        key: isle-veri-cache-v1-${{ hashFiles('cranelift/isle/**/*.rs', 'cranelift/codegen/**/*.isle') }}

  # See https://github.com/actions/deploy-pages
  deploy:
    name: Deploy gh-pages artifact
    if: github.ref == 'refs/heads/main'
    needs: publish
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
