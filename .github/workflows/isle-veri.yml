# Run the ISLE verifier (cranelift/isle/veri) on every push to `main` and on
# pull requests, sharing the SMT query cache across runs so each run is
# incremental.
#
# The cache is shared two ways:
#
#   * `actions/cache` keeps a rolling cache under the key prefix
#     `isle-veri-cache-v1` (bump the version if the cache format changes).
#     Cache entries are immutable and branch-scoped: each run saves under a
#     unique key and restores the most recent entry by prefix. Runs on `main`
#     save to the default-branch scope; PR runs can restore that cache
#     read-only but cannot write to it, so PRs always verify on top of the
#     latest `main` cache without being able to update it.
#   * Runs on `main` additionally publish the rebuilt cache as the
#     `isle-veri-cache.tar.gz` asset on the rolling `dev` release (maintained
#     by `publish-artifacts.yml`) and as a run artifact, so the cache is
#     durable and downloadable by local users via
#     `cranelift/isle/veri/setup/download-cache.sh`.
#
# The job runs `verify.sh rebuild-cache`, which verifies every expansion
# (invoking the SMT solver for cache misses) and garbage-collects unused
# cache entries.
name: ISLE Verifier
on:
  push:
    branches: [main]
    tags-ignore: [dev]
  pull_request:
  workflow_dispatch:

# `cache: write` is required for the cache save steps when a permissions
# block is present (everything unspecified defaults to `read`).
permissions:
  contents: write
  cache: write

jobs:
  verify:
    name: ISLE verifier
    runs-on: ubuntu-latest
    if: github.repository == 'bytecodealliance/wasmtime'
    # Runs can be cold (no cached SMT queries) and are slow then; use the
    # maximum allowed timeout to be safe.
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - uses: ./.github/actions/install-rust
    - name: Read pinned solver versions
      run: |
        echo "CVC5_VERSION=$(sed -n 's/^version="\([^"]*\)".*/\1/p' cranelift/isle/veri/setup/install-cvc5.sh)" >> "${GITHUB_ENV}"
        echo "Z3_VERSION=$(sed -n 's/^version="\([^"]*\)".*/\1/p' cranelift/isle/veri/setup/install-z3.sh)" >> "${GITHUB_ENV}"
    - uses: actions/cache/restore@v5
      id: smt-solvers
      with:
        path: ~/.cache/smt-solvers
        key: isle-veri-solvers-${{ runner.os }}-cvc5-${{ env.CVC5_VERSION }}-z3-${{ env.Z3_VERSION }}
    - uses: ./.github/actions/apt-get-install
      if: steps.smt-solvers.outputs.cache-hit != 'true'
      with:
        packages: wget unzip
    - name: Install SMT solvers (cvc5, z3)
      if: steps.smt-solvers.outputs.cache-hit != 'true'
      run: |
        solver_dir="$HOME/.cache/smt-solvers"
        mkdir -p "${solver_dir}/bin"
        ./cranelift/isle/veri/setup/install-cvc5.sh -i "${solver_dir}"
        ./cranelift/isle/veri/setup/install-z3.sh -b "${solver_dir}/bin"
    - uses: actions/cache/save@v5
      if: steps.smt-solvers.outputs.cache-hit != 'true'
      with:
        path: ~/.cache/smt-solvers
        key: isle-veri-solvers-${{ runner.os }}-cvc5-${{ env.CVC5_VERSION }}-z3-${{ env.Z3_VERSION }}
    - name: Add solvers to PATH
      run: echo "$HOME/.cache/smt-solvers/bin" >> "${GITHUB_PATH}"
    - name: Restore verifier SMT query cache
      uses: actions/cache/restore@v5
      id: veri-cache
      with:
        path: cranelift/isle/veri/cache
        # Cache entries are immutable: each run saves under a unique key and
        # restores the most recent entry by prefix. Bump `v1` if the cache
        # format changes.
        key: isle-veri-cache-v1-${{ github.run_id }}
        restore-keys: |
          isle-veri-cache-v1-
    - name: Verify and rebuild cache
      run: |
        mkdir -p cranelift/isle/veri/cache
        ./cranelift/isle/veri/verify.sh rebuild-cache
    - name: Save verifier SMT query cache
      # Only `main` writes to the shared cache; PR runs restore it read-only.
      if: github.ref == 'refs/heads/main'
      uses: actions/cache/save@v5
      with:
        path: cranelift/isle/veri/cache
        key: isle-veri-cache-v1-${{ github.run_id }}
    - name: Package rebuilt cache
      if: github.ref == 'refs/heads/main'
      run: tar czf isle-veri-cache.tar.gz -C cranelift/isle/veri cache
    - name: Upload cache tarball as run artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v6
      with:
        name: isle-veri-cache
        path: isle-veri-cache.tar.gz
    - name: Update dev release
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh release view dev >/dev/null 2>&1; then
            gh release upload dev isle-veri-cache.tar.gz --clobber
        else
            # Can happen on the very first run, before publish-artifacts
            # has created the dev release yet. The tarball is still
            # available as a run artifact, and the next run will pick up
            # the rebuilt cache from the actions cache anyway.
            echo "::warning::The dev release does not exist yet; skipping the release upload."
        fi
