version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1

  # The base images of CI's docker containers are pinned by digest so that
  # CI's docker layer caches, keyed on the Dockerfile contents, stay valid.
  # This is intended to keep those up-to-date as they change over time and
  # receive minor updates.
  - package-ecosystem: "docker"
    directories:
      - "/ci/docker/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      docker-base-images:
        patterns:
          - "*"
