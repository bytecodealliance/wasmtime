[package]
name = "cranelift-isle-veri-caching"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Transparent caching layer over easy-smt for the ISLE verifier"

[lints]
workspace = true

[dependencies]
easy-smt = { workspace = true }
hmac = { workspace = true }
log = { workspace = true }
serde = { workspace = true, features = ['derive'] }
serde_json = { workspace = true }
sha2 = { workspace = true }
ureq = { workspace = true, features = ["rustls"] }


[dev-dependencies]
tempfile = { workspace = true }
