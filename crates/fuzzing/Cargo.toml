[package]
authors.workspace = true
description = "Fuzzing infrastructure for Wasmtime"
edition.workspace = true
rust-version.workspace = true
name = "wasmtime-fuzzing"
publish = false
version = "0.0.0"
license = "Apache-2.0 WITH LLVM-exception"

[lints]
workspace = true

[build-dependencies]
wasmtime-test-util = { workspace = true, features = ['wast'] }

[dependencies]
wasmtime-environ = { workspace = true }
backtrace = { workspace = true }
arbitrary = { workspace = true, features = ["derive"] }
env_logger = { workspace = true }
log = { workspace = true }
mutatis = { workspace = true }
rand = { workspace = true }
smallvec = { workspace = true }
target-lexicon = { workspace = true }
tempfile = "3.3.0"
wasmparser = { workspace = true }
wasmprinter = { workspace = true }
wasmtime-wast = { workspace = true, features = ['component-model'] }
wasmtime = { workspace = true, features = ['default', 'winch', 'gc-copying'] }
wasmtime-core = { workspace = true, features = ['backtrace', 'serde'] }
wasm-encoder = { workspace = true }
wasm-smith = { workspace = true, features = ['serde'] }
wasm-mutate = { workspace = true }
wasmi = { version = "1.0.8", default-features = false, features = ["std", "simd"] }
wasmtime-test-util = { workspace = true, features = ['wast', 'wasmtime-wast', 'component-fuzz', 'component'] }
serde_json = { workspace = true }
serde = { workspace = true }

[dependencies.wasmtime-cli-flags]
workspace = true
features = [
  'async',
  'component-model',
  'component-model-async',
  'cranelift',
  'gc',
  'gc-drc',
  'gc-null',
  'memory-protection-keys',
  'pooling-allocator',
  'pulley',
  'threads',
  'parallel-compilation',
  'stack-switching',
]

# We rely on precompiled v8 binaries, but this crate doesn't have a precompiled
# version for all platforms. Allow-list certain platforms here that are indeed
# supported. Keep in-sync with the `build.rs` script for this crate which sets
# a custom `v8` #[cfg] so testing for the crate is easier in source code
# itself.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
v8 = { workspace = true, optional = true }
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
v8 = { workspace = true, optional = true }
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
v8 = { workspace = true, optional = true }

[dev-dependencies]
wat = { workspace = true }
rand = { workspace = true }
wasmtime-environ = { workspace = true }
cranelift-bforest = { workspace = true }
cranelift-bitset = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "macros", "rt-multi-thread"] }

[features]
default = ['v8']
v8 = ['dep:v8']
