[package]
name = "wasmtime-internal-fiber"
version.workspace = true
authors.workspace = true
description = "INTERNAL: Fiber support for Wasmtime"
license = "Apache-2.0 WITH LLVM-exception"
repository = "https://github.com/bytecodealliance/wasmtime"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
wasmtime-environ = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["mm"], optional = true }
libc = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
wasmtime-versioned-export-macros = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
  "Win32_System_Threading",
  "Win32_Foundation",
]

[build-dependencies]
cc = "1.0"
wasmtime-versioned-export-macros = { workspace = true }

[dev-dependencies]
backtrace = "0.3.68"

[features]

# Assume presence of the standard library. Allows propagating
# panic-unwinds across fiber invocations.
std = ['dep:rustix', 'dep:libc', 'dep:wasmtime-versioned-export-macros']

# Use embedder-provided stack-switching routines on unsupported architectures.
# See `src/stackswitch/custom.rs` for the C ABI the embedder must implement.
custom = []
