[package]
name = "wasmtime-test-util"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Utilities tests in Wasmtime"
license = "Apache-2.0 WITH LLVM-exception"
repository = "https://github.com/bytecodealliance/wasmtime"

[lints]
workspace = true

[dependencies]
serde = { workspace = true, optional = true }
serde_derive = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
arbitrary = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
proc-macro2 = { workspace = true, optional = true }
wasmtime-component-util = { workspace = true, optional = true }
wasmtime-environ = { workspace = true }
target-lexicon = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }
wasmtime = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true, features = ['std'] }
wasmtime-cli-flags = { workspace = true, optional = true, features = ['clap'] }
clap = { workspace = true, optional = true }
# NB: this crate is compiled both in as a dependency of a proc-macro and as a
# dependency of tests themselves. That means dependencies of this crate are
# compiled twice. Try to ensure "big" dependencies are optional and feature
# gated.

[dev-dependencies]
rand = { workspace = true }
wat = { workspace = true }
wasmparser = { workspace = true, features = ['validate', 'component-model', 'features'] }
wasmprinter = { workspace = true, features = ['component-model'] }
arbtest = { workspace = true }

[features]
wast = [
  'dep:serde',
  'dep:toml',
  'dep:serde_derive',
]
# Building `wasmtime_cli_flags::CommonOptions` and `wasmtime::Config` for tests.
wasmtime-wast = [
  'wast',
  'dep:wasmtime',
  'dep:wasmtime-cli-flags',
  'dep:clap',
  'dep:target-lexicon',
  'wasmtime/cranelift',
  'wasmtime/winch',
  'wasmtime/gc-drc',
  'wasmtime/gc-null',
  'wasmtime/threads',
  'wasmtime/component-model-async',
  'wasmtime-cli-flags/runtime',
  'wasmtime-cli-flags/cranelift',
  'wasmtime-cli-flags/gc-drc',
  'wasmtime-cli-flags/gc-null',
  'wasmtime-cli-flags/threads',
  'wasmtime-cli-flags/component-model',
  'wasmtime-cli-flags/component-model-async',
  'wasmtime-cli-flags/async',
  'wasmtime-cli-flags/stack-switching',
  'wasmtime-cli-flags/pooling-allocator',
  'wasmtime-cli-flags/memory-protection-keys',
]
component = [
  'arbitrary/derive',
  'wast',
  'dep:env_logger',
  'dep:wasmtime',
  'wasmtime/component-model',
  'wasmtime/async',
]
component-fuzz = [
  'dep:arbitrary',
  'arbitrary/derive',
  'dep:indexmap',
  'dep:quote',
  'dep:proc-macro2',
  'dep:wasmtime-component-util',
]
