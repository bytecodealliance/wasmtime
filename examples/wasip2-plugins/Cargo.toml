[package]
name = "calculator"
version = "0.1.0"
edition = "2024"
description = """
Example Rust-based WebAssembly host that implements a calculator
with plugins for arithmetic operations.
"""
publish = false

[lints]
workspace = true

[dependencies]
clap = { workspace = true, features = ["derive"] }
wasmtime = { workspace = true, features = ['default'] }

[features]
build-plugins = []
